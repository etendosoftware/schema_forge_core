name: Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  xml-regeneration-check:
    name: XML Regeneration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Run XML regeneration checker tests
        run: make test-xml-regeneration-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: CLI tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml 'cli/test/*.test.js'

      - name: Schema Forge core package tests
        run: npm test --workspace=packages/schema-forge-core

      - name: App shell core package tests
        run: npm test --workspace=packages/app-shell-core

      - name: Etendo GO core package tests
        run: npm test --workspace=packages/etendo-go-core

      # `npm test` above is `node --test`, which cannot render .jsx. Component
      # tests live in a separate Vitest suite per package, and every suite needs
      # its own step or it never runs: ETP-4959 wired etendo-go-core and
      # ETP-4961 wired app-shell-core (its suite is green again as of ETP-5363).
      - name: App shell core component tests
        run: npm run test:vitest --workspace=packages/app-shell-core

      - name: Etendo GO core component tests
        run: npm run test:vitest --workspace=packages/etendo-go-core

      - name: App shell core consumer smoke
        run: npm run test:consumer --workspace=packages/app-shell-core

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
