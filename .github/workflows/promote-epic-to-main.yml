name: Promote epic → develop → main

# Manual release train. Run it once the day's features have landed on the epic.
#
#   epic/ETP-XXXX ──merge──▶ develop ──merge──▶ main
#
# Everything happens in the runner's local clone first: both merges and the full
# test suite. NOTHING is pushed until every step has passed, and the final push
# is atomic (`git push --atomic origin develop main`), so develop and main move
# together or not at all. A merge conflict, a failing test, or a rejected push
# leaves both remote branches exactly as they were.
#
# Pushing main triggers release.yml (auto patch bump + publish).
#
# See docs/branch-workflow.md for the branching rules this automates.

on:
  workflow_dispatch:
    inputs:
      epic_branch:
        description: 'Epic branch to promote'
        required: true
        default: 'epic/ETP-3504'
      dry_run:
        description: 'Run merges + tests but skip the push'
        type: boolean
        required: false
        default: false

# Never let two promotions run at once — they would race on develop/main.
concurrency:
  group: promote-epic-to-main
  cancel-in-progress: false

permissions:
  contents: write   # push develop and main

jobs:
  promote:
    name: Merge, test, then push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: real merges, not shallow ones
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@etendosoftware'

      - name: Verify branches exist
        env:
          EPIC: ${{ inputs.epic_branch }}
        run: |
          set -euo pipefail
          for ref in "$EPIC" develop main; do
            if ! git rev-parse -q --verify "refs/remotes/origin/$ref" >/dev/null; then
              echo "::error::Branch '$ref' does not exist on origin."
              exit 1
            fi
          done
          echo "epic:    $(git rev-parse --short "origin/$EPIC")  $EPIC"
          echo "develop: $(git rev-parse --short origin/develop)"
          echo "main:    $(git rev-parse --short origin/main)"

      - name: Merge epic into develop (local only)
        env:
          EPIC: ${{ inputs.epic_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B develop origin/develop
          if ! git merge --no-ff --no-edit "origin/$EPIC"; then
            git merge --abort || true
            echo "::error::Conflict merging '$EPIC' into develop. Resolve it in a PR — nothing was pushed."
            exit 1
          fi

      - name: Merge develop into main (local only)
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          if ! git merge --no-ff --no-edit develop; then
            git merge --abort || true
            echo "::error::Conflict merging develop into main. Resolve it in a PR — nothing was pushed."
            exit 1
          fi

      # --- Gates: run the full suite against the merge result on main --------
      # main is the branch that gets published, and after both merges its tree is
      # the union of everything being promoted — so testing it covers develop too.
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: XML regeneration check
        run: make test-xml-regeneration-check

      - name: CLI tests
        run: npm test --workspace=cli

      - name: Schema Forge core tests
        run: npm test --workspace=packages/schema-forge-core

      - name: App shell core tests
        run: npm test --workspace=packages/app-shell-core

      - name: App shell core consumer smoke
        run: npm run test:consumer --workspace=packages/app-shell-core

      - name: Schema Forge agent context tests
        run: npm test --workspace=packages/schema-forge-agent-context

      - name: Schema Forge stack tests
        run: npm test --workspace=packages/schema-forge-stack

      # --- Point of no return: everything above passed -----------------------
      - name: Push develop and main (atomic)
        if: ${{ inputs.dry_run == false }}
        env:
          EPIC: ${{ inputs.epic_branch }}
        run: |
          set -euo pipefail

          if git diff --quiet origin/develop develop && git diff --quiet origin/main main \
             && [ "$(git rev-parse develop)" = "$(git rev-parse origin/develop)" ] \
             && [ "$(git rev-parse main)" = "$(git rev-parse origin/main)" ]; then
            echo "develop and main are already up to date with '$EPIC' — nothing to promote."
            exit 0
          fi

          # --atomic: the server accepts both refs or neither, so develop and main
          # can never end up half-promoted.
          # --no-verify: `npm install` ran the root `prepare` script, which points
          # core.hooksPath at .githooks; the local pre-push dev hook is for
          # workstations, not CI (which just ran its own gates above).
          git push --atomic --no-verify origin develop main

          echo "Promoted '$EPIC' → develop → main."
          echo "release.yml will now bump the patch version and publish."

      - name: Dry run — push skipped
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run: merges and tests passed, but nothing was pushed."
          git --no-pager log --oneline origin/main..main
