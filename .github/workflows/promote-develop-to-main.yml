name: Promote develop → main

# Manual release train. Run it once the day's merge blocks have landed on develop.
#
#   develop ──merge──▶ main
#
# Feature branches and merge blocks target `develop` directly (ETP-5028), so the
# epic is no longer part of the train — this workflow only promotes develop.
#
# The merge and the full test suite happen in the runner's local clone first.
# NOTHING is pushed until every step has passed, so a merge conflict, a failing
# test, or a rejected push leaves main exactly as it was.
#
# Pushing main triggers release.yml (auto patch bump + publish).
#
# See docs/branch-workflow.md for the branching rules this automates.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the merge + tests but skip the push'
        type: boolean
        required: false
        default: false

# Never let two promotions run at once — they would race on main.
concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

permissions:
  contents: write   # push main
  actions: write    # dispatch release.yml after the push

jobs:
  promote:
    name: Merge, test, then push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: real merges, not shallow ones
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@etendosoftware'

      - name: Verify branches exist
        run: |
          set -euo pipefail
          for ref in develop main; do
            if ! git rev-parse -q --verify "refs/remotes/origin/$ref" >/dev/null; then
              echo "::error::Branch '$ref' does not exist on origin."
              exit 1
            fi
          done
          echo "develop: $(git rev-parse --short origin/develop)"
          echo "main:    $(git rev-parse --short origin/main)"

      - name: Merge develop into main (local only)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B main origin/main
          if ! git merge --no-ff --no-edit origin/develop; then
            git merge --abort || true
            echo "::error::Conflict merging develop into main. Resolve it in a PR — nothing was pushed."
            exit 1
          fi

      # --- Gates: run the full suite against the merge result on main --------
      # main is the branch that gets published, and after the merge its tree is
      # the union of everything being promoted.
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: XML regeneration check
        run: make test-xml-regeneration-check

      - name: CLI tests
        run: npm test --workspace=cli

      - name: Schema Forge core tests
        run: npm test --workspace=packages/schema-forge-core

      - name: App shell core tests
        run: npm test --workspace=packages/app-shell-core

      - name: App shell core consumer smoke
        run: npm run test:consumer --workspace=packages/app-shell-core

      - name: Schema Forge agent context tests
        run: npm test --workspace=packages/schema-forge-agent-context

      - name: Schema Forge stack tests
        run: npm test --workspace=packages/schema-forge-stack

      # --- Point of no return: everything above passed -----------------------
      - name: Push main
        id: push
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse main)" = "$(git rev-parse origin/main)" ]; then
            echo "main is already up to date with develop — nothing to promote."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-verify: `npm install` ran the root `prepare` script, which points
          # core.hooksPath at .githooks; the local pre-push dev hook is for
          # workstations, not CI (which just ran its own gates above).
          git push --no-verify origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          echo "Promoted develop → main."
          echo "release.yml will now bump the patch version and publish."

      # --- Chain the release explicitly --------------------------------------
      # GitHub does NOT trigger workflows from events created with the default
      # GITHUB_TOKEN (anti-recursion rule), so the push above never fires
      # release.yml's `push: branches: [main]` trigger. `workflow_dispatch` and
      # `repository_dispatch` are the documented EXCEPTIONS to that rule, so this
      # works with the default token — no PAT needed.
      # Gated on the push step's own outcome: skipped on a dry run, and skipped
      # when there was nothing to promote (no new commits reached main).
      - name: Trigger release
        if: ${{ inputs.dry_run == false && steps.push.outputs.pushed == 'true' }}
        run: gh workflow run release.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run — push skipped
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run: the merge and tests passed, but nothing was pushed."
          git --no-pager log --oneline origin/main..main
